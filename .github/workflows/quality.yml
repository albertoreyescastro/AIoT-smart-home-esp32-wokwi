name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run repository validation
        run: python scripts/validate_repo.py

  arduino-compile:
    name: Compile ESP32-S3 sketches
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install "Blynk"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "DHT sensor library"

      - name: Prepare sketches for Arduino CLI
        run: |
          mkdir -p /tmp/aiot-bedroom /tmp/aiot-kitchen
          cp wokwi/bedroom/sketch.ino /tmp/aiot-bedroom/aiot-bedroom.ino
          cp wokwi/kitchen-living-room/sketch.ino /tmp/aiot-kitchen/aiot-kitchen.ino

      - name: Compile bedroom module
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/aiot-bedroom

      - name: Compile kitchen/living-room module
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/aiot-kitchen
