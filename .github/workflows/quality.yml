name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run repository validation
        run: python scripts/validate_repo.py
      - name: Run deterministic scenario contracts
        run: python scripts/test_scenarios.py

  arduino-compile:
    name: Compile ESP32-S3 sketches
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install pinned ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Install pinned Arduino libraries
        run: |
          arduino-cli lib install "Blynk@1.4.0"
          arduino-cli lib install "ESP32Servo@3.2.1"
          arduino-cli lib install "LiquidCrystal_PCF8574@2.3.0"
          arduino-cli lib install "DHT sensor library@1.4.7"
      - name: Prepare sketches for Arduino CLI
        run: |
          mkdir -p /tmp/aiot-bedroom /tmp/aiot-kitchen /tmp/aiot-kitchen-ml
          cp wokwi/bedroom/sketch.ino /tmp/aiot-bedroom/aiot-bedroom.ino
          cp wokwi/kitchen-living-room/sketch.ino /tmp/aiot-kitchen/aiot-kitchen.ino
          cp wokwi/kitchen-living-room/sketch.ino /tmp/aiot-kitchen-ml/aiot-kitchen-ml.ino
          cp tests/edge_impulse_mock.h /tmp/aiot-kitchen-ml/edge_impulse_mock.h
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/aiot-kitchen-ml/aiot-kitchen-ml.ino')
          s = p.read_text()
          s = s.replace('#define USE_EDGE_IMPULSE_RUNTIME 0', '#define USE_EDGE_IMPULSE_RUNTIME 1', 1)
          s = s.replace('#define EDGE_IMPULSE_INFERENCING_HEADER "your_project_inferencing.h"', '#define EDGE_IMPULSE_INFERENCING_HEADER "edge_impulse_mock.h"', 1)
          p.write_text(s)
          PY
      - name: Compile bedroom module
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/aiot-bedroom
      - name: Compile kitchen/living-room public default
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/aiot-kitchen
      - name: Compile optional Edge Impulse integration surface
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 /tmp/aiot-kitchen-ml
