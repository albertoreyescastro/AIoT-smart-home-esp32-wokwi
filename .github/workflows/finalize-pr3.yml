name: Finalize PR3 hardening

on:
  push:
    branches: [fix/restore-professional-latex-report]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/restore-professional-latex-report
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Preserve workflow file that cannot be pushed by GITHUB_TOKEN
        run: cp .github/workflows/quality.yml /tmp/quality.yml
      - name: Apply final hardening
        run: python scripts/apply_final_hardening.py
      - name: Restore workflow and remove temporary patch script
        run: |
          cp /tmp/quality.yml .github/workflows/quality.yml
          rm scripts/apply_final_hardening.py
      - name: Run repository validation
        run: python scripts/validate_repo.py
      - name: Run deterministic scenario contracts
        run: python scripts/test_scenarios.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply final AIoT reliability hardening [hardening-applied]"
          git push origin HEAD:fix/restore-professional-latex-report
