name: Apply hardening V2

on:
  push:
    branches: [hardening-v2-aiot-20261023]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening-v2-aiot-20261023
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply fail-closed source/diagram patch
        run: python scripts/apply_hardening_v2.py

      - name: Install pinned report dependency
        run: python -m pip install --disable-pip-version-check reportlab==5.1.0

      - name: Regenerate concise public report
        run: python scripts/build_public_report.py

      - name: Validate patched repository
        run: |
          python scripts/test_scenarios.py
          python scripts/validate_repo.py

      - name: Commit final hardening payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Apply AIoT hardening V2 runtime and report fixes"
          git push origin HEAD:hardening-v2-aiot-20261023
