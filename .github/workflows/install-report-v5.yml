name: Install verified report V5

on:
  push:
    branches: [fix/restore-professional-latex-report]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-report:
    if: ${{ !contains(github.event.head_commit.message || '', '[report-v5-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/restore-professional-latex-report
          fetch-depth: 0
      - name: Download exact audited PDF
        run: |
          curl --fail --location --retry 3 \
            'https://e4bb953e-d3bf-479c-bdbe-37242689c8b5.sandbox.floot.app/_cdn/static/2ac7b9d0-cf45-425f-9056-57805334185e-aiot-report-v5-transfer.pdf' \
            --output /tmp/aiot-report-v5.pdf
          echo 'a54fafe14310daa1e23b2751373850e1d7a8bc10838d1061340a2d7de7b5892f  /tmp/aiot-report-v5.pdf' | sha256sum --check --strict
          test "$(stat -c%s /tmp/aiot-report-v5.pdf)" -eq 4929248
      - name: Install report and commit
        run: |
          cp /tmp/aiot-report-v5.pdf report/aiot_smart_home_public_report.pdf
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/aiot_smart_home_public_report.pdf
          git commit -m 'Install audited LaTeX report V5 [report-v5-installed]'
          git push origin HEAD:fix/restore-professional-latex-report
