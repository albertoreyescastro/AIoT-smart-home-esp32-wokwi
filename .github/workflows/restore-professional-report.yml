name: Restore professional report

on:
  push:
    branches: [fix/restore-professional-latex-report]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore original authored report and remove generated-report machinery
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  ('| Reproducibility | Dataset/rule validator, scenario contracts, pinned CI toolchain and deterministic report build |',
                   '| Reproducibility | Dataset/rule validator, scenario contracts and pinned CI toolchain |'),
                  ('| Documentation | Architecture visuals, module notes, model card and concise public technical report |',
                   '| Documentation | Architecture visuals, module notes, model card and professional public technical report |'),
                  ('The validator checks dataset integrity, Wokwi diagrams, public placeholders, token patterns, offline Blynk defaults, ML-disabled semantics, dependency/CI pinning, public documentation and report size/currentness.',
                   'The validator checks dataset integrity, Wokwi diagrams, public placeholders, token patterns, offline Blynk defaults, ML-disabled semantics, dependency/CI pinning and public documentation.'),
                  ('- rebuild the public PDF with pinned ReportLab and fail if the committed PDF has drifted.\n', ''),
                  ('│   ├── build_public_report.py\n', ''),
                  ('The current public report is generated deterministically from source and is available at:',
                   'The professional public report is preserved in its authored layout and is available at:'),
                  ('[`report/aiot_smart_home_public_report.pdf`](report/aiot_smart_home_public_report.pdf)\n\n---\n\n## Licence',
                   '[`report/aiot_smart_home_public_report.pdf`](report/aiot_smart_home_public_report.pdf)\n\nFuture report changes should be made from the original LaTeX source so its formatting, figures and structure are preserved.\n\n---\n\n## Licence'),
              ],
              Path('docs/REPRODUCIBILITY.md'): [
                  ('7. The concise public PDF report from `scripts/build_public_report.py`.\n8. Historical Edge Impulse screenshots and the recorded model card.',
                   '7. The professional public PDF report as an authored portfolio artifact.\n8. Historical Edge Impulse screenshots and the recorded model card.'),
                  ('The Bedroom module uses the physical Wokwi outdoor LDR by default.',
                   'The PDF is intentionally not regenerated by CI; future report edits should be made from its original LaTeX source.\n\nThe Bedroom module uses the physical Wokwi outdoor LDR by default.'),
              ],
              Path('.github/workflows/quality.yml'): [
                  ('\n  report:\n    name: Verify public report is reproducible\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v7\n      - name: Set up Python\n        uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n      - name: Install pinned report dependency\n        run: python -m pip install --disable-pip-version-check reportlab==5.1.0\n      - name: Rebuild public report\n        run: python scripts/build_public_report.py\n      - name: Verify committed report is current\n        run: git diff --exit-code -- report/aiot_smart_home_public_report.pdf\n', '\n'),
              ],
              Path('scripts/validate_repo.py'): [
                  ('        \'"DHT sensor library@1.4.7"\', "python scripts/test_scenarios.py",\n        "reportlab==5.1.0", "git diff --exit-code -- report/aiot_smart_home_public_report.pdf",\n',
                   '        \'"DHT sensor library@1.4.7"\', "python scripts/test_scenarios.py",\n'),
                  ('    if not REPORT.exists() or REPORT.stat().st_size > 1_000_000:\n        fail("Public report missing or unexpectedly large; regenerate the concise hardened report")',
                   '    if not REPORT.exists():\n        fail("Public report missing")'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected replacement exactly once, found {count}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git checkout 00dddcd3b76e427d99cc56d513fbfeddb4ed8551 -- \
            report/aiot_smart_home_public_report.pdf report/README.md
          rm -f scripts/build_public_report.py requirements-report.txt
          rm -f .github/workflows/restore-professional-report.yml

          test "$(git hash-object report/aiot_smart_home_public_report.pdf)" = "a704bd159df45aec66c07aa94b5a18c629337e6e"
          test "$(stat -c%s report/aiot_smart_home_public_report.pdf)" = "24847493"
          test ! -e scripts/build_public_report.py
          test ! -e requirements-report.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore professional LaTeX report artifact"
          git push origin HEAD:fix/restore-professional-latex-report
